name: build-audio-modules

on:
  workflow_dispatch:            # 手动触发: Actions → 本 workflow → Run workflow
  push:
    branches: [ main, master ]
    paths: [ 'audio/**', '.github/workflows/build-audio.yml' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential flex bison bc cpio lzop \
            libssl-dev libncurses-dev wget unzip xz-utils file rsync \
            autoconf automake libtool pkg-config gettext dos2unix

      - name: Normalize line endings (git autocrlf safety)
        run: |
          dos2unix audio/build_snd.sh audio/load_snd.sh audio/test_snd.sh
          chmod +x audio/build_snd.sh

      - name: Build audio modules + arecord
        run: bash audio/build_snd.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snd-modules
          path: audio/dist/
          if-no-files-found: error
