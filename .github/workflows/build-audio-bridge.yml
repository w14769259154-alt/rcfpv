name: build-audio-bridge

on:
  workflow_dispatch:            # 手动触发: Actions → 本 workflow → Run workflow
  push:
    branches: [ main, master ]
    paths: [ 'audio/audio_bridge.c', 'audio/build_audio_bridge.sh', '.github/workflows/build-audio-bridge.yml' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential flex bison bc cpio lzop \
            libssl-dev libncurses-dev wget unzip xz-utils file rsync \
            autoconf automake libtool pkg-config gettext dos2unix

      - name: Normalize line endings
        run: |
          dos2unix audio/audio_bridge.c audio/build_audio_bridge.sh
          chmod +x audio/build_audio_bridge.sh

      - name: Build audio_bridge
        run: bash audio/build_audio_bridge.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audio-bridge
          path: audio/dist/audio_bridge
          if-no-files-found: error
