name: build-vps-edge

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths: [ 'vps-edge/**', '.github/workflows/build-vps-edge.yml' ]

jobs:
  build:
    # 必须用 22.04: 产物需在 VPS(Ubuntu 22.04, glibc 2.35) 上运行,
    # ubuntu-latest(24.04, glibc 2.39) 编出的二进制在 VPS 报 GLIBC_2.38 not found
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake pkg-config git \
            libavformat-dev libavcodec-dev libavutil-dev \
            libssl-dev nlohmann-json3-dev dos2unix

      - name: Normalize line endings
        run: |
          dos2unix vps-edge/build_vps_edge.sh vps-edge/deploy_vps.sh
          chmod +x vps-edge/build_vps_edge.sh

      - name: Build vps-edge
        run: bash vps-edge/build_vps_edge.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vps-edge-bin
          path: vps-edge/dist/rcfpv-edge
          if-no-files-found: error
