# 5gipc-rc 主摄设备端配置(自编固件内置, 方案2) — /etc/5gipc.conf
#
# 架构(方案 2, edge 在摄像头):
#   WG 隧道: 固件原生, u-boot env(wg_*), S98wireguard 自启, 本文件不管
#   视频:    majestic RTSP(554, 本地) → edge 取流 → WebRTC P2P → 地面端
#   对讲:    edge 本地 ALSA(card0 mic / card1 spk) + Opus → WebRTC 音频轨双向
#   数传:    mavfwd(/usr/bin, 固件内置) ttyS2 → WG → VPS(可选)/本地 edge 数据通道
#   信令:    edge 连 VPS WSS 8443, TURN 打洞兜底

# ===== 设备标识 =====
ROOM_ID="01"

# ===== 数传(mavfwd) =====
MAVLINK_ENABLE="1"
MAVFWD_BIN="/usr/bin/mavfwd"          # 固件内置
MAVFWD_UART="/dev/ttyS2"              # ssc338q: uart2=飞控数据口(实测)
MAVFWD_BAUD="115200"
MAVFWD_OUT="10.55.0.1:7212"           # 可选: VPS 数传中继(方案 B 遗留, 方案2可不发)

# ===== edge(方案 2 主流程) =====
EDGE_BIN="/usr/bin/rcfpv-edge"
EDGE_ENABLE="1"

# ===== 监护 =====
CHECK_INTERVAL="10"
