# 5gipc-rc 主摄设备端配置(自编固件内置) — /etc/5gipc.conf
#
# 架构(方案 B 现状 + 方案 2 预留):
#   WG 隧道: 固件原生, u-boot env(wg_*), S98wireguard 自启, 本文件不管
#   数传:    mavfwd(/usr/bin, 固件内置) 经隧道 → VPS:7212(mavfwd 直推 VPS edge)
#   视频:    majestic RTSP(554) ← VPS edge 拉流(方案 B) 或 本地 edge WebRTC(方案 2)
#   对讲:    audio_bridge(/usr/bin, 固件内置) USB声卡 ↔ UDP ↔ VPS(方案 B)
#   方案 2:  本地 edge(libdatachannel) 直接 WebRTC P2P, audio_bridge 可停用

# ===== 设备标识 =====
ROOM_ID="01"

# ===== 数传(mavfwd) =====
MAVLINK_ENABLE="1"
MAVFWD_BIN="/usr/bin/mavfwd"          # 固件内置
MAVFWD_UART="/dev/ttyS2"              # ssc338q: uart2=飞控数据口(实测)
MAVFWD_BAUD="115200"
MAVFWD_OUT="10.55.0.1:7212"           # VPS edge MavlinkBridge(UDP)

# ===== 对讲(audio_bridge, 方案 B) =====
AUDIO_BRIDGE_BIN="/usr/bin/audio_bridge"
AUDIO_BRIDGE_ARGS="-l 7214 -o 10.55.0.1:7213 -c hw:0,0 -p hw:1,0 -g 100 -v 60 -s 80"

# ===== 方案 2: 本地 WebRTC edge(预留, 0=不启动) =====
EDGE_BIN="/usr/bin/rcfpv-edge"
EDGE_ENABLE="0"

# ===== 监护 =====
CHECK_INTERVAL="10"
