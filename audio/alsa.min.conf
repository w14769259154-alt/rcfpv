# 精简 ALSA 配置 - 5gipc-rc 静态 arecord 专用
# 完整 alsa.conf 的 @hooks 需 dlopen 动态库, 静态可执行做不到会整树丢弃;
# 这里只保留 hw/plughw/default, 无 hooks 无 cards 加载。

defaults.pcm.card 0
defaults.pcm.device 0
defaults.pcm.subdevice 0
defaults.ctl.card 0

pcm.hw {
    @args [ CARD DEV SUBDEV ]
    @args.CARD { type integer }
    @args.DEV { type integer }
    @args.SUBDEV { type integer }
    type hw
    card $CARD
    device $DEV
    subdevice $SUBDEV
}

pcm.plughw {
    @args [ CARD DEV SUBDEV ]
    @args.CARD { type integer }
    @args.DEV { type integer }
    @args.SUBDEV { type integer }
    type plug
    slave.pcm {
        type hw
        card $CARD
        device $DEV
        subdevice $SUBDEV
    }
}

pcm.!default {
    type plug
    slave.pcm "hw:0,0"
}

ctl.!default {
    type hw
    card 0
}
